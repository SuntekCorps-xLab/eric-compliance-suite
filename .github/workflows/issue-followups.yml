name: Publish reviewed issue follow-ups

on:
  push:
    branches: [main]
    paths: ["reports/2026-09-05-issue-followups.json"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: eric-cli-issue-followups-2026-09-05
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'SuntekCorps-xLab/eric-compliance-suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/post_issue_followups.py reports/2026-09-05-issue-followups.json --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
