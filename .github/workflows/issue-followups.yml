name: Publish reviewed issue follow-ups

on:
  push:
    branches: [main]
    paths: ["reports/*-issue-followups.json"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: eric-cli-issue-followups
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'SuntekCorps-xLab/eric-compliance-suite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: |
          for file in reports/*-issue-followups.json; do
            python .github/scripts/post_issue_followups.py "$file" --publish
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
